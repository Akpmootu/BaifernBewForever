<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC857" />
      <stop offset="50%" stop-color="#B87433" />
      <stop offset="100%" stop-color="#EBC8B1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <circle cx="50" cy="50" r="48" fill="#F7E7CE" opacity="0.1"/>
  <!-- Double Gold Wreath Borders -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="url(#gold)" stroke-width="1.5"/>
  <circle cx="50" cy="50" r="40" fill="none" stroke="url(#gold)" stroke-width="0.5" stroke-dasharray="2 1"/>
  <!-- Heart-shaped intertwining line -->
  <path d="M 38 48 C 30 38, 48 30, 50 45 C 52 30, 70 38, 62 48 C 55 56, 50 64, 50 64 C 50 64, 45 56, 38 48 Z" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.4"/>
  <!-- Monogram text -->
  <text x="31" y="58" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="26" fill="url(#gold)" font-weight="600">B</text>
  <text x="46" y="50" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="14" fill="#C65A3A" font-weight="normal">&amp;</text>
  <text x="54" y="58" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="26" fill="url(#gold)" font-weight="600">B</text>
  <!-- Tiny dots around -->
  <circle cx="50" cy="18" r="1.5" fill="#C65A3A"/>
  <circle cx="50" cy="82" r="1.5" fill="#C65A3A"/>
  <circle cx="18" cy="50" r="1.5" fill="#C65A3A"/>
  <circle cx="82" cy="50" r="1.5" fill="#C65A3A"/>
</svg>
